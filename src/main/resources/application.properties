spring.application.name=newstrust-backend
# Default para "mvn spring-boot:run" sem nada configurado. A variavel de ambiente
# SPRING_PROFILES_ACTIVE (definida no systemd de cada ambiente) sobrescreve isto
# automaticamente - o Spring Boot mapeia essa env var para esta propriedade sem
# precisar do placeholder ${...} aqui.
spring.profiles.active=dev

# Virtual threads (Project Loom) para o servidor web - chamadas concorrentes a
# fontes externas (reputacao, embeddings, LLM) usam seus proprios executors nas
# camadas de aplicacao/infraestrutura, ver AnalyzeNewsContentService.
spring.threads.virtual.enabled=true

# --- Modelo de pontuacao (S = R*reputation + T*textualConsistency + V*crossVerification + D*dissemination) ---
# Perfil ativo por padrao - troque editando esta linha (ou sobrescrevendo em um
# application-{profile}.properties) para adequar ao dominio de aplicacao do
# deployment (ex: eleitoral eleva V, saude publica eleva R), sem recompilar codigo.
newstrust.scoring.active-profile=default

newstrust.scoring.profiles.default.reputation-weight=0.35
newstrust.scoring.profiles.default.textual-consistency-weight=0.25
newstrust.scoring.profiles.default.cross-verification-weight=0.30
newstrust.scoring.profiles.default.dissemination-weight=0.10

newstrust.scoring.profiles.election.reputation-weight=0.20
newstrust.scoring.profiles.election.textual-consistency-weight=0.20
newstrust.scoring.profiles.election.cross-verification-weight=0.50
newstrust.scoring.profiles.election.dissemination-weight=0.10

newstrust.scoring.profiles.public-health.reputation-weight=0.50
newstrust.scoring.profiles.public-health.textual-consistency-weight=0.20
newstrust.scoring.profiles.public-health.cross-verification-weight=0.20
newstrust.scoring.profiles.public-health.dissemination-weight=0.10

# --- Migrations (schema sempre versionado via Flyway - nunca ddl-auto=update) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Banco de dados (spring.datasource.*) e a CHAVE do provedor de IA
# (newstrust.ai.gemini.api-key) sao as unicas coisas que vem de variavel de
# ambiente, e so nos profiles - ver application-dev.properties e
# application-prod.properties. Tudo o mais (porta, nomes de modelo, URL do
# ScamAdviser, toggle do Swagger) e valor literal, versionado no proprio arquivo,
# porque nao e segredo.

# --- Reputacao de fonte (ScamAdviser) ---
newstrust.reputation.scamadviser.base-url=https://api.scamadviser.com

# --- Documentacao da API (OpenAPI/Swagger UI) ---
# Desligada por padrao (ver justificativa em application-prod.properties);
# application-dev.properties liga explicitamente. Metadados globais em
# infrastructure.config.OpenApiConfig; documentacao de cada endpoint nas
# interfaces de infrastructure.adapter.in.web.openapi (controllers ficam enxutos).
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
