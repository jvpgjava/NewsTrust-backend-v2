# Copie os valores abaixo para variaveis de ambiente reais (nunca para dentro do
# application*.properties versionado). Este arquivo nao contem nenhum segredo real.
#
# So existem duas categorias de coisa aqui: credenciais de banco e chaves dos
# provedores externos (Gemini, ScamAdviser). Tudo o resto (porta, nomes de
# modelo, URL do ScamAdviser, perfil de pesos, toggle do Swagger) e valor
# literal direto nos application-{profile}.properties - nao e segredo, entao
# nao precisa de variavel de ambiente. Ver docs/DEPLOY.md se quiser mudar esses
# valores por ambiente.
#
# Uso local em DEV (PowerShell) - profile "dev" e o padrao:
#   $env:DB_PASSWORD = "sua-senha-local"
#   $env:GEMINI_API_KEY_DEV = "sua-chave-de-DEV-da-api-do-gemini"
#   ./mvnw spring-boot:run
# (DB_URL/DB_USERNAME ja tem default local em application-dev.properties -
# so precisa definir se seu Postgres local nao for usuario "postgres"/banco "newstrust".)
#
# Uso em producao (systemd, profile "prod"): defina estas mesmas variaveis (com
# os sufixos _PROD) no arquivo de environment do servico - ver docs/DEPLOY.md.

# --- Banco de dados (PostgreSQL com extensao pgvector) ---
# Em dev, application-dev.properties ja assume localhost/postgres/newstrust por
# padrao. Em producao, application-prod.properties EXIGE estas 3 variaveis
# (falha rapido na subida se faltar alguma, em vez de apontar para localhost).
DB_URL=jdbc:postgresql://localhost:5432/newstrust
DB_USERNAME=postgres
DB_PASSWORD=troque-por-uma-senha-real

# --- LangChain4j / Google Gemini (API direta - aistudio.google.com) ---
# Uma chave por ambiente, para nunca misturar quota/billing/logs de dev com producao.
GEMINI_API_KEY_DEV=sua-chave-de-DEV-da-api-do-gemini
GEMINI_API_KEY_PROD=sua-chave-de-PRODUCAO-da-api-do-gemini

# --- Reputacao de fonte (ScamAdviser) ---
SCAMADVISER_API_KEY=sua-chave-da-api-do-scamadviser
